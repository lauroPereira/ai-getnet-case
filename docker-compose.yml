services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mocks:
    image: ghcr.io/lauropereira/ai-getnet-case:${APP_VERSION:-latest}
    build: .
    pull_policy: missing
    entrypoint: ["uvicorn", "merchant_assistant.mocks.service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MOCK_SERVICES_DIR: /app/data/mock-services
      # v0.7.0: synthetic merchant receiver of conversation.replied (POST/GET /merchant/events), same value as the api.
      CONVERSATION_WEBHOOK_SECRET: ${CONVERSATION_WEBHOOK_SECRET:-conversation-webhook-secret-fictitious}
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  api:
    # v1.0.0 (task 106): the image the CI publishes on each tag (APP_VERSION, default latest); built from this
    # Dockerfile when it is not on this host nor in the registry. `docker compose up --build` rebuilds from source.
    image: ghcr.io/lauropereira/ai-getnet-case:${APP_VERSION:-latest}
    build: .
    pull_policy: missing
    depends_on:
      qdrant:
        condition: service_started
      mocks:
        condition: service_healthy
      ticketing:  # the first handoff.created after `up` finds the receiver listening (the ticketing never waits for the api)
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # only the Streamlit interface is exposed outside this host (ADR 0015)
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      MOCKS_URL: http://mocks:8001
      DEMO_MODE: ${DEMO_MODE:-true}
      BUDGET_LIMIT_USD: ${BUDGET_LIMIT_USD:-1.00}
      API_WORKERS: ${API_WORKERS:-2}  # uvicorn --workers (v0.13.0); 1 returns to a single worker
      # v0.7.0 identity: issuer seen by the other containers; fictitious example credentials (same as .env.example).
      JWT_ISSUER: ${JWT_ISSUER:-http://api:8000}
      DEMO_USER_PASSWORDS: ${DEMO_USER_PASSWORDS:-cliente1988:cliente1988-fictitious,cliente_demo_002:cliente-demo-002-fictitious,op_ana:op-ana-fictitious,op_bruno:op-bruno-fictitious}
      TICKETING_CLIENT_SECRET: ${TICKETING_CLIENT_SECRET:-ticketing-demo-secret-fictitious}
      # v0.13.0 (task 98): external OIDC issuers, empty by default; .env.example has the value for the `oidc` profile.
      OIDC_ISSUERS: ${OIDC_ISSUERS:-}
      # v0.7.0 webhooks (task 66): container addresses, fixed here like MOCKS_URL; one fictitious secret per direction,
      # the same values as the ticketing and mocks blocks and .env.example.
      TICKETING_WEBHOOK_URL: http://ticketing:8002/webhooks/assistant
      CONVERSATION_WEBHOOK_URL: http://mocks:8001/merchant/events
      TICKETING_WEBHOOK_SECRET: ${TICKETING_WEBHOOK_SECRET:-ticketing-webhook-secret-fictitious}
      ASSISTANT_WEBHOOK_SECRET: ${ASSISTANT_WEBHOOK_SECRET:-assistant-webhook-secret-fictitious}
      CONVERSATION_WEBHOOK_SECRET: ${CONVERSATION_WEBHOOK_SECRET:-conversation-webhook-secret-fictitious}
      # v0.13.0 (task 100): the Telegram adapter of the `telegram` profile; empty URL = no case goes to Telegram.
      TELEGRAM_WEBHOOK_URL: ${TELEGRAM_WEBHOOK_URL:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      TELEGRAM_BOT_TOKEN: ""  # the bot token belongs to the adapter only; this blanks the one the .env would pass
      # v0.13.0 (task 101): OTLP span export, empty = off; http://otel-collector:4318 with `--profile otel`.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    volumes:
      - runtime:/app/runtime
    restart: unless-stopped

  ticketing:
    image: ghcr.io/lauropereira/ai-getnet-case:${APP_VERSION:-latest}
    build: .
    pull_policy: missing
    entrypoint: ["uvicorn", "merchant_assistant.ticketing.service:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "127.0.0.1:8002:8002"  # the web ticketing screen runs on the host
    environment:
      TICKETING_DB_PATH: /app/runtime/ticketing.sqlite3
      ASSISTANT_URL: http://api:8000
      ASSISTANT_ISSUER: http://api:8000
      ASSISTANT_JWKS_URL: http://api:8000/.well-known/jwks.json
      TICKETING_WEBHOOK_SECRET: ${TICKETING_WEBHOOK_SECRET:-ticketing-webhook-secret-fictitious}
      ASSISTANT_WEBHOOK_SECRET: ${ASSISTANT_WEBHOOK_SECRET:-assistant-webhook-secret-fictitious}
      TICKETING_CLIENT_ID: ${TICKETING_CLIENT_ID:-ticketing-demo}
      TICKETING_CLIENT_SECRET: ${TICKETING_CLIENT_SECRET:-ticketing-demo-secret-fictitious}
      # v1.0.0: an operator action waits for the assistant's reply, which includes a model call; the web screen waits 20 s
      TICKETING_WEBHOOK_TIMEOUT_S: ${TICKETING_WEBHOOK_TIMEOUT_S:-15}
    volumes:
      - ticketing_runtime:/app/runtime  # own database, separate from the assistant's runtime volume
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  dex:  # v0.13.0 (task 98): external OIDC issuer of the demonstration, only with `--profile oidc`
    image: ghcr.io/dexidp/dex:v2.41.1
    profiles: ["oidc"]
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./docker/dex/config.yaml:/etc/dex/config.yaml:ro  # synthetic users and fictitious secrets
    ports:
      - "127.0.0.1:5556:5556"  # token endpoint for the smoke test on this host; `iss` stays http://dex:5556/dex
    healthcheck:  # busybox wget of the Alpine-based image
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:5556/dex/.well-known/openid-configuration"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  telegram:  # v0.13.0 (task 100): operator on Telegram, only with `--profile telegram` and a bot token
    image: ghcr.io/lauropereira/ai-getnet-case:${APP_VERSION:-latest}
    build: .
    pull_policy: missing
    profiles: ["telegram"]
    entrypoint: ["python", "-m", "merchant_assistant.integrations.telegram"]
    depends_on:
      api:
        condition: service_healthy
    environment:  # no env_file: the adapter never receives the provider keys
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_OPERATOR_CHAT_ID: ${TELEGRAM_OPERATOR_CHAT_ID:-}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      TELEGRAM_CLIENT_SECRET: ${TELEGRAM_CLIENT_SECRET:-}
      TELEGRAM_DB_PATH: /app/runtime/telegram.sqlite3
      TELEGRAM_HOST: 0.0.0.0
      ASSISTANT_URL: http://api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    expose:
      - "8003"  # reached only by the api, at http://telegram:8003/webhooks/assistant
    volumes:
      - telegram_runtime:/app/runtime  # own database: cases shown, updates applied, polling offset
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: on-failure:3

  tunnel:  # v1.0.0 (task 108, ADR 0026): single origin for the demonstration tunnel, only with `--profile tunnel`
    image: caddy:2.10.0-alpine
    profiles: ["tunnel"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      STREAMLIT_UPSTREAM: ${STREAMLIT_UPSTREAM:-host.docker.internal:8501}  # the interface, run on this host
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Docker Engine on Linux; Docker Desktop already resolves it
    volumes:
      - ./docker/tunnel/Caddyfile:/etc/caddy/Caddyfile:ro  # only GET/POST /v1/auth/authorize reach the api
    ports:
      - "127.0.0.1:8080:8080"  # `cloudflared tunnel --url http://localhost:8080` publishes this port
    restart: unless-stopped

  # v0.13.0 (task 101): telemetry, only with `--profile otel`. The collector receives the OTLP spans and prints them
  # (`docker compose logs otel-collector`); Prometheus scrapes /metrics and loads alerts/rules.yml; Grafana opens the
  # versioned dashboard observability/grafana/assistant.json over Prometheus.
  otel-collector:
    image: otel/opentelemetry-collector:0.115.0
    profiles: ["otel"]
    command: ["--config=/etc/otelcol/collector.yaml"]
    volumes:
      - ./docker/otel/collector.yaml:/etc/otelcol/collector.yaml:ro
    ports:
      - "127.0.0.1:4318:4318"  # OTLP/HTTP for an API run on this host; the api container uses otel-collector:4318
    # no healthcheck: the image has no shell nor HTTP client; `docker compose ps` shows it running and its log says
    # "Everything is ready"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["otel"]
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./docker/otel/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts/rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:  # busybox wget of the image
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["otel"]
    depends_on:
      - prometheus
    environment:
      # demonstration credentials (fictitious, same as .env.example): replace them before exposing Grafana
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana-admin-fictitious}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./docker/otel/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./docker/otel/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./observability/grafana:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:  # busybox wget of the Alpine-based image
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  qdrant_storage:
  runtime:
  ticketing_runtime:
  telegram_runtime:
