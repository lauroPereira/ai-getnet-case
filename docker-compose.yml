services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mocks:
    build: .
    entrypoint: ["uvicorn", "merchant_assistant.mocks.service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MOCK_SERVICES_DIR: /app/data/mock-services
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  api:
    build: .
    depends_on:
      qdrant:
        condition: service_started
      mocks:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      MOCKS_URL: http://mocks:8001
      DEMO_MODE: ${DEMO_MODE:-true}
      BUDGET_LIMIT_USD: ${BUDGET_LIMIT_USD:-1.00}
    volumes:
      - runtime:/app/runtime
    restart: unless-stopped

volumes:
  qdrant_storage:
  runtime:
