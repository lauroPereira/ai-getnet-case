services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  api:
    build: .
    depends_on:
      - qdrant
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      DEMO_MODE: ${DEMO_MODE:-true}
      BUDGET_LIMIT_USD: ${BUDGET_LIMIT_USD:-1.00}
    volumes:
      - runtime:/app/runtime
    restart: unless-stopped

volumes:
  qdrant_storage:
  runtime:
