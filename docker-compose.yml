services:
  qdrant:
    image: qdrant/qdrant:v1.19.2
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  mocks:
    build: .
    entrypoint: ["uvicorn", "merchant_assistant.mocks.service:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      MOCK_SERVICES_DIR: /app/data/mock-services
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/openapi.json', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  api:
    build: .
    depends_on:
      qdrant:
        condition: service_started
      mocks:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"  # only the Streamlit interface is exposed outside this host (ADR 0015)
    env_file:
      - path: .env
        required: false
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      QDRANT_URL: http://qdrant:6333
      MOCKS_URL: http://mocks:8001
      DEMO_MODE: ${DEMO_MODE:-true}
      BUDGET_LIMIT_USD: ${BUDGET_LIMIT_USD:-1.00}
    volumes:
      - runtime:/app/runtime
    restart: unless-stopped

  ticketing:
    build: .
    entrypoint: ["uvicorn", "merchant_assistant.ticketing.service:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "127.0.0.1:8002:8002"  # the web ticketing screen runs on the host
    environment:
      TICKETING_DB_PATH: /app/runtime/ticketing.sqlite3
      ASSISTANT_URL: http://api:8000
      ASSISTANT_ISSUER: http://api:8000
      ASSISTANT_JWKS_URL: http://api:8000/.well-known/jwks.json
      TICKETING_WEBHOOK_SECRET: ${TICKETING_WEBHOOK_SECRET:-ticketing-webhook-secret-fictitious}
      ASSISTANT_WEBHOOK_SECRET: ${ASSISTANT_WEBHOOK_SECRET:-assistant-webhook-secret-fictitious}
      TICKETING_CLIENT_ID: ${TICKETING_CLIENT_ID:-ticketing-demo}
      TICKETING_CLIENT_SECRET: ${TICKETING_CLIENT_SECRET:-ticketing-client-secret-fictitious}
    volumes:
      - ticketing_runtime:/app/runtime  # own database, separate from the assistant's runtime volume
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

volumes:
  qdrant_storage:
  runtime:
  ticketing_runtime:
