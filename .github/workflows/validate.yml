name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Dependencies (no provider keys; tests use the scripted model)
        run: python -m pip install -e ".[ingest,dev]"

      - name: Strict validation (pytest, Ruff, skills metadata)
        run: python tools/scripts/lint_and_tests.py --strict
