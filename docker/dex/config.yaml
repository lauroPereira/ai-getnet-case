# Dex: external OIDC issuer of the demonstration (v0.13.0, spec D2, task 98). Runs only with
# `docker compose --profile oidc up`; the API accepts its tokens when OIDC_ISSUERS names it (see .env.example).
# DEMONSTRATION ONLY: synthetic users, fictitious passwords and client secret, in-memory storage. Replace all of them
# before any exposure outside this host.
issuer: http://dex:5556/dex  # the `iss` of every token; the API reaches Dex by this name inside the compose network

storage:
  type: memory

web:
  http: 0.0.0.0:5556

expiry:
  idTokens: "1h"

oauth2:
  skipApprovalScreen: true
  passwordConnector: local  # grant_type=password with the static users below (smoke test and QA)

enablePasswordDB: true

staticClients:
  - id: merchant-assistant  # the audience of the tokens (OIDC_ISSUERS "audience")
    name: Assistente do lojista (demonstração)
    secret: merchant-assistant-dex-secret-fictitious
    redirectURIs:
      - http://localhost:8501/
      - http://127.0.0.1:8501/

# Login by e-mail. The static users of Dex v2.41.1 emit no `groups` claim (task 102a), so OIDC_ISSUERS maps the
# `email` claim (scope `email`; it must come with `email_verified: true`) to a role by exact address, and reads
# `username`, the `name` claim (scope `profile`), as the merchant id. Both are set here by the administrator; the user
# cannot change them. Passwords (bcrypt, cost 10):
#   cliente1988@lojista.example     dex-cliente1988-fictitious   merchant cliente1988
#   op_ana@operador.example         dex-op-ana-fictitious        operator
#   visitante@visitante.example     dex-visitante-fictitious     no role in OIDC_ISSUERS (refused with 403)
staticPasswords:
  - email: cliente1988@lojista.example
    hash: "$2b$10$qwTAa6K3.yXXtkUBwdD/ae7k3CXc3HoFYObWESf7g0R294OQLSQyW"
    username: cliente1988
    userID: 7d1c9a52-3f0e-4c1b-9a51-1a2b3c4d5e01
  - email: op_ana@operador.example
    hash: "$2b$10$WEAyYq4G0nZBSqsWKsfXMOPuJxFdCZj94P.XGHMsRknz4Po3L3DGC"
    username: op_ana
    userID: 7d1c9a52-3f0e-4c1b-9a51-1a2b3c4d5e02
  - email: visitante@visitante.example
    hash: "$2b$10$HEMQWhwzIE3sK/K6PzmD.u.YbRZiKSCD9iEMzOLgG8.hfAcXRcjA6"
    username: visitante
    userID: 7d1c9a52-3f0e-4c1b-9a51-1a2b3c4d5e03
