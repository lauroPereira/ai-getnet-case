# Prometheus of the `otel` compose profile (v0.13.0, task 101): scrapes the API's /metrics and evaluates the
# versioned alert rules; Grafana reads from here.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: merchant-assistant
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
